[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rainfall-coherence"
version = "1.0.0"
description = "Rainfall and Sentinel-1 interferometric coherence: a global dose-response"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jiawei Li", email = "jiawei.li@colostate.edu" }]
keywords = ["InSAR", "Sentinel-1", "coherence", "decorrelation", "rainfall"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
extract = ["rasterio>=1.3", "requests>=2.31", "earthengine-api>=0.1.380"]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/jldz9/s1-rainfall-coherence"

[project.scripts]
rcoh = "rainfall_coherence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
